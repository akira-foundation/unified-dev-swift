<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A plain fill stencil: Icon Composer applies the rounded-square mask and the colour below,
       from icon.json's "srgb:" fill, so this draws no radius and no colour of its own. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#000"/>
</svg>
