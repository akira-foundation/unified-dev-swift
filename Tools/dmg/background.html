<!doctype html>
<!-- The disk image window, one 660x400 field, rendered to PNG at 1x and 2x by
     Tools/dmg/build.sh and shown behind Finder's icon view. It paints the
     violet field and the arrow between the two tiles, and nothing else:
     Finder draws the app icon and the Applications folder itself, so neither
     belongs in here.

     Everything positional is calibrated against what Finder actually draws,
     not against what the settings ask for, and each calibrated number carries
     its measurement in the comment beside it. The method, if the icon or the
     icon locations ever change: render the icon at 512 with NSWorkspace (that
     is the tile as Finder draws it), take the bounding box of the alpha above
     240, mount the built image, screenshot the window at 2x, and measure
     pixels; do not reason from the settings alone.

     The three tones are derived from the app icon's own fill, which
     Resources/UnifiedDev.icon/icon.json gives as srgb 0.4863,0.2275,0.9294,
     that is #7C3AED, or OKLCH L 0.5414 C 0.2466 h 293.01. Every tone holds
     that hue and 0.45 of that chroma, and only the lightness moves: 1.72 of
     it for the top of the field, 1.62 for the bottom, 0.48 for the arrow. The
     arrow lands on #291253 and is exactly on the hue. The two light tones are
     not, and cannot be: sRGB runs out of violet above a lightness ratio of
     1.478 at that chroma, so clipping to the cube is part of the derivation
     and it carries the hue to 305.5 and 298.4 as it pulls the chroma down to
     0.05 and 0.08. The field is therefore a pale violet rather than a
     saturated one, which is what it should be, because Finder draws the two
     labels in the system label colour and nothing in a disk image can change
     that. In dark mode that colour is white; on a light mode Mac, which is
     the default, it is near black. On the mounted window the label row
     measures 10.9:1, and the arrow reads 12.3:1 against the top of the field
     and 10.5:1 against the bottom.

     A dark field was tried first and photographed, and the same measurement
     put those labels at 1.12:1, which is unreadable. A light band behind the
     label row fixed the number and looked like the thing it replaced. The
     field carries its own legibility instead. -->
<html><head><meta charset="utf-8"><style>
* { box-sizing:border-box; margin:0; }
body { margin:0; }
.canvas { position:relative; width:660px; height:400px; overflow:hidden; background:linear-gradient(180deg,#EBDBFF 0%,#D9C9FF 100%); }
</style></head><body><div class="canvas">
      <svg style="position:absolute;inset:0" width="660" height="400" viewBox="0 0 660 400">
        <!-- The arrow spans the gap between the two pieces of artwork Finder
             draws, and it is centred in that gap rather than in the window.
             Both tiles are 128pt and sit on the row at y 190, so each tile's
             origin is at window y 126.7, the odd 0.7 coming off a mounted
             retina screenshot. Our icon's artwork fills 50..461 of a 512
             render, which is 12.5..115.25 of the tile, so with the app
             located at x 197 its artwork ends at window x 248.25 and its
             vertical centre is 190.6. The generic folder's artwork fills
             21..490 by 67..444 of the same render, which is 5.25..122.75 by
             16.75..111.25 of the tile, so with Applications located at x 463
             its artwork starts at window x 404.25 and its vertical centre is
             190.7 as well. That leaves 156pt of empty field from 248.25 to
             404.25, centred on x 326.25, and the arrow is 90pt of it: 33pt of
             clearance from our icon and 30pt from the folder once the head's
             round join is counted. It sits on y 190.6, the centre line both
             tiles share.

             Drawn as a shaft and a chevron on one stroke width rather than as
             a filled shape, so the 1x render has no half pixel edges to
             soften, and with round caps and a round join because that is how
             macOS draws its own arrow glyph. The shaft stops at x 368.25, so
             its 3pt round cap closes exactly on the chevron's vertex and sits
             wholly inside the arms, whose own round join carries the drawn tip
             on to 374.25. Ending it short of that leaves a pinhole where the
             cap curves away from the upper arm, and two earlier numbers, 365
             and 362.5, showed as a swelling and as that pinhole. -->
        <g fill="none" stroke="#291253" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 281.25 190.6 L 368.25 190.6"/>
          <path d="M 352.5 178 L 371.25 190.6 L 352.5 203.2"/>
        </g>
      </svg>
</div></body></html>
