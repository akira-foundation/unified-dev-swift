name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to rebuild, for example v1.4.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: unifieddev-release
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      notes: ${{ steps.notes.outputs.body }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install git-cliff
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: git-cliff

      - name: Verify tag matches the version computed from commits
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -d "$TAG" >/dev/null
          previous="$(git tag -l)"
          bumped=""
          [ -n "$previous" ] && bumped="$(git-cliff --config cliff.toml --bumped-version)"
          git tag "$TAG" "$GITHUB_SHA"
          if [ -z "$previous" ]; then
            echo "No prior tags found; skipping the bump check for the first release."
            exit 0
          fi
          if [ "$bumped" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version git-cliff computes from the commits since the last release ($bumped). Delete the tag, re-tag as $bumped, and push again: git tag -d $TAG && git push origin :refs/tags/$TAG && git tag $bumped && git push --follow-tags"
            exit 1
          fi

      - name: Generate CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --config cliff.toml --tag "$TAG" --output CHANGELOG.md

      - name: Commit CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "kid"
          git config user.email "kidiatoliny@gmail.com"
          default_branch="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): $TAG"
          git push origin "HEAD:$default_branch" || echo "::warning::CHANGELOG.md was not pushed to $default_branch, which has moved past $TAG."

      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --latest --strip all > "$RUNNER_TEMP/notes.md"
          delimiter="NOTES_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
            *) flags+=(--latest) ;;
          esac
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "${flags[@]}"

  release:
    needs: changelog
    if: ${{ !cancelled() && needs.changelog.result != 'failure' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD }}

    steps:
      - name: Work out what is being released
        id: release
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          [ "$EVENT" = "push" ] && tag="$PUSHED_TAG"
          [ -n "$tag" ] || { echo "No tag to build."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Check everything needed is configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Not configured:$missing"
            exit 1
          fi
          echo "All secrets are present."

      - name: Check the toolchain
        run: |
          set -euo pipefail
          swift --version
          version="$(xcodebuild -version)"
          echo "$version"
          major="$(printf '%s\n' "$version" | sed -n '1s/^Xcode \([0-9]*\).*/\1/p')"
          if [ "$major" -lt 26 ]; then
            echo "Unified Dev needs Xcode 26 or newer, this runner has $major."
            exit 1
          fi

      - name: Check Chrome is here for the disk image
        run: |
          set -euo pipefail
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "No Chrome on this runner. Installing it."
            brew install --cask google-chrome
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Derive the version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          Tools/release/version.sh "$TAG" >> "$GITHUB_OUTPUT"
          eval "$(Tools/release/version.sh "$TAG")"
          echo "Bundle will say $version ($build)"

      - name: Import the signing certificate
        id: keychain
        env:
          UD_CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          UD_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: Tools/release/keychain.sh import > /dev/null

      - name: Build
        run: ./Tools/build.sh -r

      - name: Sign, notarise and staple
        id: package
        env:
          UD_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || steps.keychain.outputs.identity }}
          UD_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          UD_NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          UD_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/UnifiedDev.app"
          zip="$PWD/dist/unified_dev_${VERSION}_aarch64.zip"
          dmg="$PWD/dist/unified_dev_${VERSION}_aarch64.dmg"
          Tools/release/package-app.sh --app "$app" --zip "$zip" --dmg "$dmg" \
            --version "$VERSION" --build "$BUILD"
          [ -s "$zip" ] || { echo "No zip was produced."; exit 1; }
          [ -s "$dmg" ] || { echo "No disk image was produced."; exit 1; }
          {
            echo "zip=$zip"
            echo "dmg=$dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the zip and the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
          fi

      - name: Send GitHub Release to Discord
        if: github.event_name == 'push' && env.DISCORD_WEBHOOK != ''
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ env.DISCORD_WEBHOOK }}
          release_name: ${{ steps.release.outputs.tag }}
          release_body: ${{ needs.changelog.outputs.notes }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          color: "2105893"
          username: "Unified Dev"
          avatar_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          content: "||@everyone||"
          footer_title: "Unified Dev"
          footer_icon_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          footer_timestamp: true

      - name: Remove the certificate
        if: always()
        run: Tools/release/keychain.sh cleanup || true
