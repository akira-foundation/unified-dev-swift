name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to rebuild, for example v1.4.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: unifieddev-release
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG_NAME: ${{ github.ref_name }}
    outputs:
      notes: ${{ steps.notes.outputs.body }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install git-cliff
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: git-cliff

      - name: Resolve production branch
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          resolve_production_branch() {
            if git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
              echo main
              return 0
            fi
            if [ "${DEFAULT_BRANCH}" != develop ]; then
              echo "${DEFAULT_BRANCH}"
              return 0
            fi
            if git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null; then
              echo master
              return 0
            fi
            return 1
          }
          if ! PRODUCTION_BRANCH="$(resolve_production_branch)"; then
            echo "::error::No production branch: origin/main does not exist and the default branch is develop. Release tags are created only on main (the production branch) or on a maintenance line N.x; name the production branch main."
            exit 1
          fi
          {
            echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}"
            echo "PRODUCTION_BRANCH=${PRODUCTION_BRANCH}"
          } >> "$GITHUB_ENV"

      - name: Verify tag matches the version computed from commits
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -d "${TAG_NAME}" >/dev/null
          trap 'git tag "${TAG_NAME}" "${GITHUB_SHA}"' EXIT

          if [ -z "$(git tag -l)" ]; then
            echo "No prior tags found; skipping the bump check for this repository's first release."
            exit 0
          fi

          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)"
          EXPECTED="$(git-cliff --config cliff.toml --use-branch-tags --bumped-version)"

          TAG_MAJOR="${TAG_NAME#v}"
          TAG_MAJOR="${TAG_MAJOR%%.*}"
          EXPECTED_MAJOR="${EXPECTED#v}"
          EXPECTED_MAJOR="${EXPECTED_MAJOR%%.*}"
          MAINTENANCE_BRANCH="origin/${TAG_MAJOR}.x"
          if [ "${EXPECTED_MAJOR}" -gt "${TAG_MAJOR}" ] \
            && git rev-parse --verify --quiet "refs/remotes/${MAINTENANCE_BRANCH}" >/dev/null \
            && git merge-base --is-ancestor "${GITHUB_SHA}" "${MAINTENANCE_BRANCH}" \
            && ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${PRODUCTION_BRANCH}"; then
            EXPECTED="$(git-cliff --config cliff.toml --use-branch-tags --bump minor --bumped-version)"
            echo "::warning::${MAINTENANCE_BRANCH#origin/} carries breaking changes since ${PREVIOUS:-the last release}. A maintenance line cannot move to the next major, so the release is checked as ${EXPECTED}; document the break in the upgrade guide."
          fi

          if [ -n "${PREVIOUS}" ] && [ "${EXPECTED}" = "${PREVIOUS}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            EXPECTED="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ "${EXPECTED}" != "${TAG_NAME}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match the version computed from the commits since ${PREVIOUS:-the last release} (${EXPECTED}). Delete the tag, re-tag as ${EXPECTED}, and push again: git tag -d ${TAG_NAME} && git push origin :refs/tags/${TAG_NAME} && git tag ${EXPECTED} && git push --follow-tags"
            exit 1
          fi

      - name: Generate CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --config cliff.toml --use-branch-tags --tag "${TAG_NAME}" --output CHANGELOG.md

      - name: Extract release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --use-branch-tags --current --strip all > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "Maintenance release with no user-facing changes." > "${RUNNER_TEMP}/release-notes.md"
          fi
          DELIMITER="notes_$(openssl rand -hex 16)"
          {
            echo "body<<${DELIMITER}"
            cat "${RUNNER_TEMP}/release-notes.md"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release branch
        id: branch
        run: |
          set -euo pipefail
          MAJOR="${TAG_NAME#v}"
          MAJOR="${MAJOR%%.*}"
          STABLE="${TAG_NAME%%-*}"

          LINE=""
          for CANDIDATE in "release/${STABLE}" "release/${STABLE#v}" "${MAJOR}.x" "${PRODUCTION_BRANCH}"; do
            if git rev-parse --verify --quiet "refs/remotes/origin/${CANDIDATE}" >/dev/null \
              && git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${CANDIDATE}"; then
              LINE="${CANDIDATE}"
              break
            fi
          done

          if [ -z "${LINE}" ]; then
            echo "::error::${TAG_NAME} is not contained in origin/release/${STABLE}, origin/${PRODUCTION_BRANCH} or origin/${MAJOR}.x; refusing to publish it. Release tags are created on the release branch release/${STABLE}, on ${PRODUCTION_BRANCH} (the production branch), or, for fixes to a previous major, on a maintenance line N.x; never on develop, milestone/* or a work branch."
            exit 1
          fi

          BRANCH="${LINE}"
          if [ "${LINE}" = "${PRODUCTION_BRANCH}" ]; then
            BRANCH="${DEFAULT_BRANCH}"
          fi

          is_highest_stable_tag() {
            local HIGHEST
            local SCOPE=()
            if [ "${TAG_NAME}" != "${TAG_NAME%%-*}" ] && [ -n "$(git tag --list "${TAG_NAME%%-*}")" ]; then
              return 1
            fi
            if [ -n "${1:-}" ]; then
              SCOPE=(--merged "origin/$1")
            fi
            HIGHEST="$( { git tag "${SCOPE[@]}" --list 'v[0-9]*' | grep -v -- '-' || true; echo "${TAG_NAME}"; } | sort -V | tail -n1)"
            [ "${HIGHEST}" = "${TAG_NAME}" ]
          }

          NEWEST=false
          if is_highest_stable_tag "${BRANCH}"; then
            NEWEST=true
          fi

          heads_for_production() {
            case "${LINE}" in
              release/*) return 0 ;;
            esac

            [ "${LINE}" = "${PRODUCTION_BRANCH}" ]
          }

          PRERELEASE=false
          LATEST=false
          case "${TAG_NAME}" in
            *-*) PRERELEASE=true ;;
            *)
              if heads_for_production && is_highest_stable_tag; then
                LATEST=true
              fi
              ;;
          esac

          echo "Release line: ${LINE}; changelog branch: ${BRANCH} (default ${DEFAULT_BRANCH}, production ${PRODUCTION_BRANCH}); newest on branch: ${NEWEST}; latest: ${LATEST}; prerelease: ${PRERELEASE}"
          {
            echo "name=${BRANCH}"
            echo "newest=${NEWEST}"
            echo "latest=${LATEST}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.branch.outputs.latest }}
          PRERELEASE: ${{ steps.branch.outputs.prerelease }}
        run: |
          gh release delete "${TAG_NAME}" --yes 2>/dev/null || true
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --verify-tag \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest="${LATEST}" \
            --prerelease="${PRERELEASE}"

      - name: Commit CHANGELOG
        continue-on-error: true
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          NEWEST: ${{ steps.branch.outputs.newest }}
        run: |
          set -euo pipefail
          if [ "${NEWEST}" != true ]; then
            echo "::notice::${BRANCH} already carries a release newer than ${TAG_NAME}; CHANGELOG.md on ${BRANCH} is left as is."
            exit 0
          fi

          git config user.name "kid"
          git config user.email "kidiatoliny@gmail.com"
          mv CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git checkout -f -B "${BRANCH}" "origin/${BRANCH}"
          cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(changelog): ${TAG_NAME}"
          git push origin "HEAD:refs/heads/${BRANCH}" || echo "::warning::CHANGELOG.md was not pushed to ${BRANCH}; the release is published and the next tag regenerates it."

  release:
    needs: changelog
    if: ${{ !cancelled() && needs.changelog.result != 'failure' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD }}

    steps:
      - name: Work out what is being released
        id: release
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          [ "$EVENT" = "push" ] && tag="$PUSHED_TAG"
          [ -n "$tag" ] || { echo "No tag to build."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Check everything needed is configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Not configured:$missing"
            exit 1
          fi
          echo "All secrets are present."

      - name: Check the toolchain
        run: |
          set -euo pipefail
          swift --version
          version="$(xcodebuild -version)"
          echo "$version"
          major="$(printf '%s\n' "$version" | sed -n '1s/^Xcode \([0-9]*\).*/\1/p')"
          if [ "$major" -lt 26 ]; then
            echo "Unified Dev needs Xcode 26 or newer, this runner has $major."
            exit 1
          fi

      - name: Check Chrome is here for the disk image
        run: |
          set -euo pipefail
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "No Chrome on this runner. Installing it."
            brew install --cask google-chrome
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Derive the version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          Tools/release/version.sh "$TAG" >> "$GITHUB_OUTPUT"
          eval "$(Tools/release/version.sh "$TAG")"
          echo "Bundle will say $version ($build)"

      - name: Import the signing certificate
        id: keychain
        env:
          UD_CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          UD_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: Tools/release/keychain.sh import > /dev/null

      - name: Build
        run: ./Tools/build.sh -r

      - name: Sign, notarise and staple
        id: package
        env:
          UD_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || steps.keychain.outputs.identity }}
          UD_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          UD_NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          UD_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/UnifiedDev.app"
          zip="$PWD/dist/unified_dev_${VERSION}_aarch64.zip"
          dmg="$PWD/dist/unified_dev_${VERSION}_aarch64.dmg"
          Tools/release/package-app.sh --app "$app" --zip "$zip" --dmg "$dmg" \
            --version "$VERSION" --build "$BUILD"
          [ -s "$zip" ] || { echo "No zip was produced."; exit 1; }
          [ -s "$dmg" ] || { echo "No disk image was produced."; exit 1; }
          {
            echo "zip=$zip"
            echo "dmg=$dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Attach the zip and the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
          fi

      - name: Send GitHub Release to Discord
        if: github.event_name == 'push' && env.DISCORD_WEBHOOK != ''
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ env.DISCORD_WEBHOOK }}
          release_name: ${{ steps.release.outputs.tag }}
          release_body: ${{ needs.changelog.outputs.notes }}
          release_html_url: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          color: "2105893"
          username: "Unified Dev"
          avatar_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          content: "||@everyone||"
          footer_title: "Unified Dev"
          footer_icon_url: "https://avatars.githubusercontent.com/u/116525492?s=96&v=4"
          footer_timestamp: true

      - name: Remove the certificate
        if: always()
        run: Tools/release/keychain.sh cleanup || true
